root /usr/share/nginx/html;
index index.html;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
add_header X-Frame-Options DENY always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

location = /api/v1/internal { return 404; }
location ^~ /api/v1/internal/ { return 404; }
location = /api { return 404; }
location ^~ /api/ {
    set $api_backend http://api:8000;
    proxy_pass $api_backend$request_uri;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # This is the public edge: replace client-supplied forwarding chains so
    # authentication and email limits cannot be bypassed with a forged IP.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
}
location /assets/ {
    try_files $uri =404;
    expires 1y;
}
location = /index.html {
    expires -1;
}
location / {
    try_files $uri $uri/ /index.html;
}
