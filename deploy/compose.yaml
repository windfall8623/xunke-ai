name: zhixue-ai

x-backend-env: &backend-env
  APP_ENV: production
  APP_DEBUG: "false"
  PRACTICE_ENABLED: ${PRACTICE_ENABLED:-false}
  COURSE_ENABLED: ${COURSE_ENABLED:-true}
  COURSE_PROVIDER_TIMEOUT_SECONDS: ${COURSE_PROVIDER_TIMEOUT_SECONDS:-120}
  COURSE_JOB_DEADLINE_SECONDS: ${COURSE_JOB_DEADLINE_SECONDS:-300}
  PRACTICE_SHORT_ANSWER_ENABLED: ${PRACTICE_SHORT_ANSWER_ENABLED:-false}
  PRACTICE_GRADING_OUTPUT_TOKENS: ${PRACTICE_GRADING_OUTPUT_TOKENS:-2048}
  PRACTICE_GRADING_CONTEXT_WINDOW: ${PRACTICE_GRADING_CONTEXT_WINDOW:-32768}
  PRACTICE_GRADING_PROFILE_PATH: ${PRACTICE_GRADING_PROFILE_PATH:-}
  PRACTICE_GRADING_PROFILE_HASH: ${PRACTICE_GRADING_PROFILE_HASH:-}
  DATA_DIR: /app/data
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: ${MYSQL_DATABASE:-zhixue_ai}
  MYSQL_USER: ${MYSQL_USER:-zhixue}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in deploy/.env}
  MYSQL_AUTO_INIT: "false"
  COOKIE_SECURE: "true"
  WEB_ORIGINS: ${WEB_ORIGINS:?Set an HTTPS WEB_ORIGINS JSON array in deploy/.env}
  JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET in deploy/.env}
  EVAL_WORKER_TOKEN: ${EVAL_WORKER_TOKEN:?Set a random EVAL_WORKER_TOKEN in deploy/.env}
  LEGACY_LINK_ENABLED: ${LEGACY_LINK_ENABLED:-false}
  WECHAT_APP_ID:
  WECHAT_APP_SECRET:
  # Preserve DeepSeek for existing env files that omit the provider selector.
  LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-}
  PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-45}
  JOB_DEADLINE_SECONDS: ${JOB_DEADLINE_SECONDS:-180}
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
  DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  DASHSCOPE_EMBEDDING_MODEL: ${DASHSCOPE_EMBEDDING_MODEL:-text-embedding-v4}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
  DASHSCOPE_IMAGE_API_KEY: ${DASHSCOPE_IMAGE_API_KEY:-}
  DASHSCOPE_IMAGE_MODEL: ${DASHSCOPE_IMAGE_MODEL:-qwen-image-2.0}
  DASHSCOPE_IMAGE_BASE_URL: ${DASHSCOPE_IMAGE_BASE_URL:-}
  ENABLE_WEB_SEARCH: ${ENABLE_WEB_SEARCH:-false}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  RAG_PIPELINE_ID: ${RAG_PIPELINE_ID:-dense-v1}
  RERANKER_BASE_URL: ${RERANKER_BASE_URL:-}
  RERANKER_API_KEY: ${RERANKER_API_KEY:-}
  RERANKER_MODEL: ${RERANKER_MODEL:-}
  RERANKER_MODEL_REVISION: ${RERANKER_MODEL_REVISION:-}
  RERANKER_LICENSE: ${RERANKER_LICENSE:-}
  RERANKER_LLM_MAX_INPUT_TOKENS: ${RERANKER_LLM_MAX_INPUT_TOKENS:-12000}
  RERANKER_LLM_MAX_OUTPUT_TOKENS: ${RERANKER_LLM_MAX_OUTPUT_TOKENS:-512}
  RERANKER_LLM_TIMEOUT_SECONDS: ${RERANKER_LLM_TIMEOUT_SECONDS:-90}
  PRICING_VERSION: ${PRICING_VERSION:-unconfigured}
  # Null-valued entries forward configured values and omit unset prices entirely.
  # Unknown prices must never silently become zero-cost observations.
  LLM_INPUT_CNY_PER_MILLION:
  LLM_OUTPUT_CNY_PER_MILLION:
  LLM_CACHE_READ_CNY_PER_MILLION:
  LLM_CACHE_WRITE_CNY_PER_MILLION:
  PRICING_USD_TO_CNY:
  EMBEDDING_CNY_PER_MILLION:
  RERANK_CALL_CNY:
  SEARCH_CALL_CNY:
  IMAGE_CALL_CNY:
  PRODUCTION_DAILY_COST_CNY: ${PRODUCTION_DAILY_COST_CNY:-100}
  GLOBAL_DAILY_COST_CNY: ${GLOBAL_DAILY_COST_CNY:-1000}
  EVAL_DAILY_COST_CNY: ${EVAL_DAILY_COST_CNY:-200}
  EVAL_INGEST_DAILY_COST_CNY: ${EVAL_INGEST_DAILY_COST_CNY:-20}
  LEGACY_SOURCE_ARCHIVE: ${LEGACY_SOURCE_ARCHIVE:-}
  LEGACY_SOURCE_ARCHIVE_SHA256: ${LEGACY_SOURCE_ARCHIVE_SHA256:-}
  LEGACY_SOURCE_COMMIT: ${LEGACY_SOURCE_COMMIT:-7302ad2}

x-backend: &backend
  image: zhixue-ai-backend:${IMAGE_TAG:-local}
  build:
    context: ..
    dockerfile: backend/Dockerfile
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment: *backend-env
  depends_on:
    mysql:
      condition: service_healthy

services:
  # Keep loopback independent of API container replacement or long outages.
  # Reuse the built backend image without loading the app, credentials, or data.
  control-network:
    image: zhixue-ai-backend:${IMAGE_TAG:-local}
    command: ["python", "-c", "import signal; signal.pause()"]
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      disable: true
    networks:
      default:
        aliases: [api]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zhixue_ai}
      MYSQL_USER: ${MYSQL_USER:-zhixue}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in deploy/.env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  api:
    <<: *backend
    network_mode: service:control-network
    depends_on:
      control-network:
        condition: service_started
        restart: true
      mysql:
        condition: service_healthy
    volumes: &api-volumes
      - app_data:/app/data
      # A private, inaccessible mount makes the owner's index unavailable here.
      - type: tmpfs
        target: /app/data/chroma
        tmpfs:
          size: 65536
          mode: 0

  rag-owner:
    <<: *backend
    command: ["python", "-m", "app.workers.rag_owner", "--worker-id", "compose-rag-owner"]
    stop_grace_period: 210s
    healthcheck:
      disable: true
    volumes:
      - app_data:/app/data
      - chroma_data:/app/data/chroma
    deploy:
      replicas: 1
      update_config:
        order: stop-first

  eval-scorer:
    image: zhixue-ai-evaluation:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: evaluation/Dockerfile
      target: core
    # The control client accepts cleartext only on loopback. No DB credentials,
    # source filesystem, backend Python packages, or Chroma volumes are shared.
    network_mode: service:control-network
    depends_on:
      control-network:
        condition: service_started
        restart: true
      api:
        condition: service_healthy
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      EVAL_CONTROL_URL: http://127.0.0.1:8000/api/v1
      EVAL_WORKER_TOKEN: ${EVAL_WORKER_TOKEN:?Set a random EVAL_WORKER_TOKEN in deploy/.env}
      EVAL_CONTROL_OUTAGE_SECONDS: ${EVAL_CONTROL_OUTAGE_SECONDS:-60}
    command: ["python", "-m", "rag_eval.worker", "--worker-id", "compose-eval-scorer"]

  web:
    image: zhixue-ai-web:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: web/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - type: bind
        source: ./certs
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: false

  migrate:
    <<: *backend
    profiles: [tools]
    restart: "no"
    command: ["python", "scripts/migrate.py"]
    healthcheck:
      disable: true
    volumes: *api-volumes

volumes:
  mysql_data:
  app_data:
  chroma_data:
