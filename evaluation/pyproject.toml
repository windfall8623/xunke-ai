[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xunke-rag-evaluation"
version = "1.0.0"
description = "Xunke AI evaluation of retrieval, quiz, QA and learning artifacts"
requires-python = ">=3.11,<3.12"
dependencies = ["jsonschema>=4.25.1,<5", "httpx==0.28.1"]

[project.optional-dependencies]
ragas = ["ragas==0.4.3", "langchain-community==0.4.1", "anthropic==0.125.0"]

[project.scripts]
rag-eval = "rag_eval.cli:main"
rag-eval-worker = "rag_eval.worker:main"

[tool.setuptools.packages.find]
include = ["rag_eval*"]

[tool.setuptools.package-data]
rag_eval = ["schemas/*.json"]
